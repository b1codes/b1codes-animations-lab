name: Canonical Constants CI Check

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/core/src/constants.ts'
      - 'packages/flutter/lib/src/core/constants.dart'
      - 'packages/swift/Sources/B1CodesLoaders/Core/**'
      - 'scripts/verify-constants.js'
      - '.github/workflows/constants.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/core/src/constants.ts'
      - 'packages/flutter/lib/src/core/constants.dart'
      - 'packages/swift/Sources/B1CodesLoaders/Core/**'
      - 'scripts/verify-constants.js'
      - '.github/workflows/constants.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-constants.js
